  // One "cuck-oo": a falling minor third, soft sine with a little overtone
  function playCuckooCall() {
    if (!cuckooOn || !audioCtx || audioCtx.state !== 'running') return;
    const t = audioCtx.currentTime + 0.02;
    const note = (f0, f1, start, dur) => {
      [[1, 0.5], [2, 0.12]].forEach(([mul, vol]) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(f0 * mul, t + start);
        o.frequency.exponentialRampToValueAtTime(f1 * mul, t + start + dur);
        g.gain.setValueAtTime(0.0001, t + start);
        g.gain.exponentialRampToValueAtTime(vol, t + start + 0.025);
        g.gain.setValueAtTime(vol, t + start + dur * 0.55);
        g.gain.exponentialRampToValueAtTime(0.0001, t + start + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t + start); o.stop(t + start + dur + 0.05);
      });
    };
    note(884, 872, 0, 0.2);        // cuck
    note(742, 730, 0.26, 0.36);    // -oo
  }

  function later(fn, ms) { cuckooTimers.push(setTimeout(fn, ms)); }

  function singCall() {
    playCuckooCall();
    cuckooEl.classList.add('calling', 'open');
    later(() => cuckooEl.classList.remove('open'), 200);
    later(() => cuckooEl.classList.add('open'), 260);
    later(() => cuckooEl.classList.remove('open'), 620);
  }

  function runCuckoo(count) {
    if (!cuckooOn || cuckooBusy) return;
    cuckooBusy = true;
    CALL_GAP = speed > 8 ? 700 : 1000;                    // quicker calls when time is racing
    cuckooEl.classList.add('ajar');                       // doors open
    later(() => cuckooEl.classList.add('out'), 300);      // bird pops out
    for (let i = 0; i < count; i++) later(singCall, 800 + i * CALL_GAP);
    later(() => {
      cuckooEl.classList.remove('calling', 'open');
      cuckooEl.classList.remove('out');                   // bird goes back in
      later(() => { cuckooEl.classList.remove('ajar'); cuckooBusy = false; }, 600);
    }, 800 + (count - 1) * CALL_GAP + 900);
  }

  // Switching off mid-call: stop everything and tuck the bird away at once
  function cancelCuckoo() {
    cuckooTimers.forEach(clearTimeout);
    cuckooTimers = [];
    cuckooEl.classList.remove('calling', 'open', 'out');
    setTimeout(() => cuckooEl.classList.remove('ajar'), 450);
    cuckooBusy = false;
  }

  // Watches the (virtual) clock and fires when it crosses :00 or :30
  function checkCuckoo(d, dt) {
    const half = d.getMinutes() >= 30 ? 1 : 0;
    const key = (d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate()) * 100 + d.getHours() * 2 + half;
    const cur = { key, h: d.getHours(), half };
    const prev = lastBucket;
    lastBucket = cur;
    const step = Math.abs(virtualTime - lastVT);
    const jumped = lastVT !== null && step > dt * speed + 1500;   // Reset / manual time change
    lastVT = virtualTime;
    if (!prev || prev.key === key || jumped) return;
    // Works at any speed now; only skip the big gap when a hidden tab wakes up again
    if (dt > 1500) return;
    // moving forward the boundary we crossed starts the new slot; in reverse it starts the old one
    const hit = direction > 0 ? cur : prev;
    runCuckoo(hit.half ? 1 : (hit.h % 12 || 12));
  }

  cuckooEl.addEventListener('click', () => { unlockAudio(); runCuckoo(1); });   // tap the house for a sample call
  soundBtn.addEventListener('click', () => {
    unlockAudio();
    cuckooOn = !cuckooOn;
    if (!cuckooOn) cancelCuckoo();
    try { localStorage.setItem('braunCuckoo', cuckooOn ? 'on' : 'off'); } catch (e) {}
    syncSoundBtn();
  });

  /* ---------- Speak the time (clock-aligned: every N minutes counted from midnight) ---------- */
  const speakDd = document.getElementById('speakDd');
  const btnSpeak = document.getElementById('btnSpeak');
  const speakMenu = document.getElementById('speakMenu');
  const speakOpts = speakMenu.querySelectorAll('.speak-opt');
  const hasVoice = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
  let speakOn = false;
  let speakEvery = 15;
  let lastSpeak = null;     // { key, t0 } bucket of the clock
  let lastSpeakVT = null;

  if (!hasVoice) speakDd.hidden = true;
  try {
    const v = parseInt(localStorage.getItem('braunSpeakEvery'), 10);
    if ([1, 5, 10, 15, 20, 30, 45, 60].indexOf(v) >= 0) speakEvery = v;
  } catch (e) {}

  function syncSpeakUI() {
    btnSpeak.textContent = speakOn ? I18N[lang].speakN(speakEvery) : t('speakOff');
    btnSpeak.classList.toggle('active', speakOn);
    speakOpts.forEach(o => {
      const m = parseInt(o.dataset.min, 10);
      const on = speakOn ? m === speakEvery : m === 0;
      o.classList.toggle('active', on);
      o.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  }

  function openSpeakMenu(open) {
    speakMenu.hidden = !open;
    btnSpeak.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function timePhrase(h, m) {
    if (lang === 'es') {
      if (m === 0 && h === 0) return 'Es medianoche.';
      if (m === 0 && h === 12) return 'Es mediodía.';
      if (model === 'word') return wordSpec(h, m).phrase + '.';
      const h12e = h % 12 || 12, art = h12e === 1 ? 'Es la ' : 'Son las ';
      const per = h < 6 ? 'de la madrugada' : h < 12 ? 'de la mañana' : h < 20 ? 'de la tarde' : 'de la noche';
      return m === 0 ? `${art}${h12e} en punto ${per}.` : `${art}${h12e} y ${m} ${per}.`;
    }
    if (m === 0 && h === 0) return "It's midnight.";
    if (m === 0 && h === 12) return "It's noon.";
    if (model === 'word') return wordSpec(h, m).phrase + '.';   // same wording as the letter grid
    const ap = h < 12 ? 'AM' : 'PM', h12 = h % 12 || 12;
    return m === 0 ? `It's ${h12} ${ap}.` : `It's ${h12}:${pad(m)} ${ap}.`;
  }

  function say(text) {
    if (!hasVoice) return;
    try {
      if (speechSynthesis.speaking) speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === 'es' ? 'es-ES' : 'en-US';
      u.rate = 0.95;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  // Wait for the cuckoo to finish its calls so the two never talk over each other
  function sayWhenFree(text, tries) {
    if (!speakOn) return;
    if (cuckooBusy && (tries || 0) < 60) { setTimeout(() => sayWhenFree(text, (tries || 0) + 1), 700); return; }
    say(text);
  }

  function checkSpeak(d, dt) {
    const t = d.getHours() * 60 + d.getMinutes();
    const key = (d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate()) * 2000 + Math.floor(t / speakEvery);
    const cur = { key, t0: Math.floor(t / speakEvery) * speakEvery };
    const prev = lastSpeak;
    lastSpeak = cur;
    const step = Math.abs(virtualTime - lastSpeakVT);
    const jumped = lastSpeakVT !== null && step > dt * speed + 1500;
    lastSpeakVT = virtualTime;
    if (!speakOn || !prev || prev.key === key || jumped) return;
    if (dt > 1500) return;                       // tab was hidden: no catch-up speech
    if (speed > 8) {
      // Fast-forward: say the time as it is right now, never queue or cut off a phrase,
      // and don't wait for the cuckoo (they simply overlap)
      if (hasVoice && !speechSynthesis.speaking) say(timePhrase(d.getHours(), d.getMinutes()));
      return;
    }
    const hit = direction > 0 ? cur : prev;      // forward: the new slot starts here; reverse: the old one did
    sayWhenFree(timePhrase(Math.floor(hit.t0 / 60), hit.t0 % 60));
  }

  btnSpeak.addEventListener('click', e => { e.stopPropagation(); openSpeakMenu(speakMenu.hidden); });
  speakOpts.forEach(o => o.addEventListener('click', e => {
    e.stopPropagation();
    const m = parseInt(o.dataset.min, 10);
    const wasOn = speakOn;
    if (m === 0) {
      speakOn = false;
      if (hasVoice) { try { speechSynthesis.cancel(); } catch (err) {} }
    } else {
      speakEvery = m;
      speakOn = true;
      try { localStorage.setItem('braunSpeakEvery', String(m)); } catch (err) {}
      if (!wasOn) {                                   // tap = permission to speak + instant sample
        const d = new Date(virtualTime);
        say(timePhrase(d.getHours(), d.getMinutes()));
      }
    }
    lastSpeak = null;
    syncSpeakUI();
    openSpeakMenu(false);
    btnSpeak.focus({ preventScroll: true });
  }));
  document.addEventListener('click', e => { if (!speakDd.contains(e.target)) openSpeakMenu(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') openSpeakMenu(false); });
  syncSpeakUI();

  /* ---------- Keep screen awake ---------- */
  const btnAwake = document.getElementById('btnAwake');
  let awakeOn = false;
  let awakeLock = null;
  if (!(navigator.wakeLock && navigator.wakeLock.request)) btnAwake.hidden = true;
  try { awakeOn = localStorage.getItem('braunAwake') === 'on'; } catch (e) {}

  function syncAwakeBtn() {
    btnAwake.textContent = awakeOn ? t('awakeOn') : t('awakeOff');
    btnAwake.classList.toggle('active', awakeOn);
    btnAwake.setAttribute('aria-pressed', awakeOn ? 'true' : 'false');
  }
  async function acquireAwake() {
    if (!awakeOn || awakeLock || !navigator.wakeLock || document.visibilityState !== 'visible') return;
    try {
      awakeLock = await navigator.wakeLock.request('screen');
      awakeLock.addEventListener('release', () => { awakeLock = null; });
    } catch (e) { awakeLock = null; }
  }
  function releaseAwake() {
    if (awakeLock) { awakeLock.release().catch(() => {}); awakeLock = null; }
  }
  btnAwake.addEventListener('click', async () => {
    awakeOn = !awakeOn;
    if (awakeOn) {
      await acquireAwake();
      if (!awakeLock) {                                   // refused (needs https, or the browser said no)
        awakeOn = false;
        btnAwake.textContent = t('notAllowed');
        setTimeout(syncAwakeBtn, 2200);
        return;
      }
    } else {
      releaseAwake();
    }
    try { localStorage.setItem('braunAwake', awakeOn ? 'on' : 'off'); } catch (e) {}
    syncAwakeBtn();
  });
  // The browser drops the lock when the tab is hidden: take it back on return
  document.addEventListener('visibilitychange', acquireAwake);
  // A remembered "on" is re-armed by the first tap on the page
  window.addEventListener('pointerdown', acquireAwake, { once: true, passive: true });
  acquireAwake();
  syncAwakeBtn();

  /* ---------- AR wall view (camera + motion sensors) ----------
     The camera feed is the background; the clock is a flat panel pinned to a fixed
     direction in space, so it stays on the wall as you move the phone. */
  const AR_K = 740 / 296;
  const AR_DIST = 1000;               // virtual distance in px-units
  const D2R = Math.PI / 180;
  const arEl = document.getElementById('ar');
  const arVideo = document.getElementById('arVideo');
  const arStage = document.getElementById('arStage');
  const arPlane = document.getElementById('arPlane');
  const arCtx = document.getElementById('arCanvas').getContext('2d');
  const arAbout = document.getElementById('arAbout');
  const arCuckoo = document.getElementById('arCuckoo');
  const btnAR = document.getElementById('btnAR');
  let arActive = false, arStream = null, arWake = null, arF = 700;
  let ori = null, needPlace = true, az = 0, pitch = 0, sc = 1, arLocked = false, fadeIdx = 0;
  const FADES = [1, 0.7, 0.4];

  // Only offer AR on touch devices with a camera
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.matchMedia('(pointer: coarse)').matches) {
    btnAR.hidden = false;
  }

  function setF() {
    arF = 0.866 * window.innerHeight;     // ~60° vertical field of view of the iPhone camera
    arStage.style.perspective = arF + 'px';
  }
  window.addEventListener('resize', () => { if (arActive) setF(); });

  window.addEventListener('deviceorientation', e => {
    if (e.beta === null || e.beta === undefined) return;
    ori = [e.alpha || 0, e.beta, e.gamma || 0];
  });

  // Rotation matrix device -> world (W3C order Z-X'-Y''), row-major
  function rotM(o) {
    const a = o[0] * D2R, b = o[1] * D2R, g = o[2] * D2R;
    const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), cg = Math.cos(g), sg = Math.sin(g);
    return [
      ca*cg - sa*sb*sg, -cb*sa, ca*sg + cg*sa*sb,
      cg*sa + ca*sb*sg,  ca*cb, sa*sg - ca*cg*sb,
      -cb*sg,            sb,    cb*cg
    ];
  }

  async function startAR() {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') { alert(t('alertMotion')); return; }
      }
      arStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    } catch (err) {
      alert(t('alertAR') +((err && err.message) || err));
      return;
    }
    arVideo.srcObject = arStream;
    arVideo.play().catch(() => {});
    arEl.hidden = false;
    arActive = true;
    needPlace = true;
    setF();
    const hint = document.getElementById('arHint');
    hint.style.opacity = 1;
    setTimeout(() => { hint.style.opacity = 0; }, 5000);
    try { if (navigator.wakeLock) arWake = await navigator.wakeLock.request('screen'); } catch (e) {}
  }

  function stopAR() {
    arActive = false;
    if (arStream) arStream.getTracks().forEach(t => t.stop());
    arStream = null;
    arVideo.srcObject = null;
    if (arWake) { arWake.release().catch(() => {}); arWake = null; }
    arEl.hidden = true;
  }

  function arTick() {
    if (!ori) return;
    const R3 = rotM(ori);
    if (needPlace) {                       // pin the clock where the camera is pointing now
      const fx = -R3[2], fy = -R3[5], fz = -R3[8];
      az = Math.atan2(fy, fx);
      pitch = Math.max(-0.6, Math.min(0.6, Math.asin(Math.max(-1, Math.min(1, fz)))));
      needPlace = false;
    }
    // text on the wall mirrors the main page
    document.getElementById('arBrand').textContent = brandEl.textContent;
    document.getElementById('arBrand').style.opacity = brandEl.classList.contains('fade') ? 0 : 1;
    document.getElementById('arTime').textContent = digitalEl.textContent + (statusEl.textContent ? '  ' + statusEl.textContent : '');
    document.getElementById('arDate').textContent = dateEl.textContent;
    // cuckoo on the wall mirrors the one on the page
    const cn = 'cuckoo ar-cuckoo' + ['out', 'ajar', 'calling', 'open'].filter(c => cuckooEl.classList.contains(c)).map(c => ' ' + c).join('');
    if (arCuckoo.className !== cn) arCuckoo.className = cn;
    arCuckoo.style.opacity = cuckooOn ? '' : '0.4';
    document.querySelectorAll('.ar-bottom .btn').forEach(b => {
      const src = document.getElementById(b.dataset.for);
      b.textContent = src.textContent;
      b.classList.toggle('active', src.classList.contains('active'));
    });
    const showAbout = aboutEl.classList.contains('show');
    arAbout.classList.toggle('show', showAbout);
    if (showAbout) arAbout.textContent = aboutText.textContent;

    // vertical wall panel facing the viewer, placed at (az, pitch)
    const cp = Math.cos(pitch);
    const C = [AR_DIST * cp * Math.cos(az), AR_DIST * cp * Math.sin(az), AR_DIST * Math.sin(pitch)];
    const U = [Math.sin(az), -Math.cos(az), 0], V = [0, 0, 1], N = [-Math.cos(az), -Math.sin(az), 0];
    const T = v => [
      R3[0]*v[0] + R3[3]*v[1] + R3[6]*v[2],
      R3[1]*v[0] + R3[4]*v[1] + R3[7]*v[2],
      R3[2]*v[0] + R3[5]*v[1] + R3[8]*v[2]
    ];
    const u = T(U), v = T(V), n = T(N), c = T(C);
    if (c[2] > -30) { arM = null; arPlane.style.visibility = 'hidden'; return; }   // behind the camera
    arPlane.style.visibility = 'visible';
    arM = { c0: [u[0]*sc, -u[1]*sc, u[2]*sc], c1: [-v[0]*sc, v[1]*sc, -v[2]*sc], c3: [c[0], -c[1], c[2] + arF] };
    const f = x => x.toFixed(5);
    arPlane.style.transform = `matrix3d(${f(u[0]*sc)},${f(-u[1]*sc)},${f(u[2]*sc)},0,` +
      `${f(-v[0]*sc)},${f(v[1]*sc)},${f(-v[2]*sc)},0,` +
      `${f(n[0])},${f(-n[1])},${f(n[2])},0,` +
      `${f(c[0])},${f(-c[1])},${f(c[2] + arF)},1)`;
  }

  // Gestures: drag moves the clock along the wall, pinch resizes it
  let tp = null;
  const pts = e => {
    const t = e.touches;
    return { n: t.length, x: t[0].clientX, y: t[0].clientY,
             d: t.length > 1 ? Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY) : 0 };
  };
  arEl.addEventListener('touchstart', e => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    tp = pts(e);
  }, { passive: false });
  arEl.addEventListener('touchmove', e => {
    if (!tp || arLocked || e.target.closest('button')) return;
    e.preventDefault();
    const q = pts(e);
    if (q.n === 1 && tp.n === 1) {
      az -= (q.x - tp.x) / arF / Math.max(0.3, Math.cos(pitch));
      pitch = Math.max(-1.0, Math.min(1.0, pitch - (q.y - tp.y) / arF));
    } else if (q.n === 2 && tp.n === 2 && tp.d > 0) {
      sc = Math.max(0.25, Math.min(5, sc * q.d / tp.d));
    }
    tp = q;
  }, { passive: false });
  arEl.addEventListener('touchend', e => { tp = e.touches.length ? pts(e) : null; });

  /* ---------- Photo: camera frame + clock, saved or shared ---------- */
  let arM = null;
  // Draws the cuckoo house (above the brand name) into the photo texture,
  // reading the live animation state from the AR copy so the photo matches the screen
  function drawCuckooTex(g, rgb) {
    const mat = el => { const t = getComputedStyle(el).transform; try { return t && t !== 'none' ? new DOMMatrix(t) : new DOMMatrix(); } catch (e) { return new DOMMatrix(); } };
    const birdEl = arCuckoo.querySelector('.cuckoo-bird');
    const bm = mat(birdEl);
    const lm = mat(arCuckoo.querySelector('.cuckoo-door.l'));
    const rm = mat(arCuckoo.querySelector('.cuckoo-door.r'));
    const bk = mat(arCuckoo.querySelector('.beak-low'));
    const beakAng = Math.atan2(bk.b, bk.a);
    const fluor = `rgb(${rgb})`;
    const X = 118, Y = -143, Wd = 84, Ht = 70;                 // house, in wall-plane units
    const arch = (x, y, w, h, rt, rb) => {
      g.beginPath();
      g.moveTo(x, y + rt);
      g.arc(x + rt, y + rt, rt, Math.PI, 0);
      g.lineTo(x + w, y + h - rb);
      g.arcTo(x + w, y + h, x + w - rb, y + h, rb);
      g.lineTo(x + rb, y + h);
      g.arcTo(x, y + h, x, y + h - rb, rb);
      g.closePath();
    };
    g.save();
    if (!cuckooOn) g.globalAlpha = 0.4;
    arch(X, Y, Wd, Ht, 42, 5);
    g.fillStyle = '#050505'; g.fill();

    g.save();
    arch(X + 1, Y + 1, Wd - 2, Ht - 2, 41, 4);
    g.clip();
    // bird (same box and transform as the CSS version: 58x54 box, 3px above the floor)
    const bl = X + 1 + (82 - 58) / 2, bb = Y + Ht - 1 - 3, bt = bb - 54;
    g.save();
    g.translate(bl + 29, bb);
    g.transform(bm.a, bm.b, bm.c, bm.d, bm.e, bm.f);
    g.translate(-(bl + 29), -bb);
    g.translate(bl + 0.2, bt);
    g.scale(0.9, 0.9);
    g.fillStyle = fluor; g.strokeStyle = fluor;
    g.fill(new Path2D('M4 47 L20 34 L25 47 Z'));
    g.beginPath(); g.ellipse(30, 40, 18, 11, -12 * Math.PI / 180, 0, Math.PI * 2); g.fill();
    g.fill(new Path2D('M36 38 L48 29 L52 38 Z'));
    g.beginPath(); g.arc(46, 26, 8, 0, Math.PI * 2); g.fill();
    g.fill(new Path2D('M53 23 L63 26.5 L53 28 Z'));
    g.save(); g.translate(53, 28); g.rotate(beakAng); g.translate(-53, -28);
    g.fill(new Path2D('M53 28 L61 30.5 L53 32 Z')); g.restore();
    g.fillStyle = '#0c0c0c'; g.beginPath(); g.arc(48, 24.5, 1.7, 0, Math.PI * 2); g.fill();
    g.save(); g.globalAlpha *= 0.7; g.strokeStyle = '#0c0c0c'; g.lineWidth = 1.6; g.lineCap = 'round';
    g.stroke(new Path2D('M22 42 Q31 33 41 41')); g.restore();
    g.strokeStyle = fluor; g.lineWidth = 2; g.lineCap = 'round';
    g.stroke(new Path2D('M30 50 V57 M37 50 V57'));
    g.restore();
    // floor
    g.fillStyle = '#1a1a1a'; g.fillRect(X + 1, Y + Ht - 1 - 6, 82, 6);
    g.fillStyle = `rgba(${rgb},.25)`; g.fillRect(X + 1, Y + Ht - 1 - 6, 82, 1);
    // doors (scaleX from their outer edge)
    const dh = Ht - 2, dy = Y + 1;
    g.fillStyle = '#171717';
    g.fillRect(X + 1, dy, 41 * lm.a, dh);
    g.fillRect(X + 83 - 41 * rm.a, dy, 41 * rm.a, dh);
    g.fillStyle = `rgba(${rgb},.35)`;
    if (lm.a > 0.05) g.fillRect(X + 1 + 41 * lm.a - 1, dy, 1, dh);
    if (rm.a > 0.05) g.fillRect(X + 83 - 41 * rm.a, dy, 1, dh);
    g.restore();

    arch(X + 0.5, Y + 0.5, Wd - 1, Ht - 1, 41.5, 4.5);
    g.strokeStyle = `rgba(${rgb},.45)`; g.lineWidth = 1; g.stroke();
    g.restore();
  }

  function buildTex() {
    const k = 2.3, X0 = -110, Y0 = -180, SW = 540, SH = 610;
    const t = document.createElement('canvas');
    t.width = Math.round(SW * k); t.height = Math.round(SH * k);
    const g = t.getContext('2d');
    g.scale(k, k); g.translate(-X0, -Y0);
    const rgb = COLORS[colorIndex].join(',');
    const hg = g.createRadialGradient(160, 160, 0, 160, 160, 382);
    hg.addColorStop(0, `rgba(${rgb},.22)`); hg.addColorStop(0.68, `rgba(${rgb},0)`);
    g.fillStyle = hg; g.fillRect(X0, Y0, SW, SH);
    g.save();
    const bg = g.createRadialGradient(112, 96, 0, 112, 96, 300);
    bg.addColorStop(0, '#2c2c2c'); bg.addColorStop(0.4, '#111'); bg.addColorStop(1, '#0d0d0d');
    g.shadowColor = 'rgba(0,0,0,.85)'; g.shadowBlur = 40; g.shadowOffsetY = 8;
    if (model === 'analog') { g.beginPath(); g.arc(160, 160, 160, 0, Math.PI * 2); } else { rr(g, 0, 0, 320, 320, 34); }
    g.fillStyle = bg; g.fill();
    g.restore();
    g.drawImage(document.getElementById('arCanvas'), 12, 12, 296, 296);
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.font = "26px BraunLogo, Helvetica, Arial, sans-serif";
    g.fillStyle = `rgba(${rgb},.6)`; g.fillText(brandEl.textContent.toUpperCase(), 160, -32);
    g.font = "300 20px 'Helvetica Neue', Helvetica, Arial, sans-serif";
    g.fillStyle = `rgba(${rgb},.85)`;
    g.fillText(digitalEl.textContent + (statusEl.textContent ? '  ' + statusEl.textContent : ''), 160, 366);
    g.font = "300 11px 'Helvetica Neue', Helvetica, Arial, sans-serif";
    g.fillStyle = `rgba(${rgb},.6)`; g.fillText(dateEl.textContent.toUpperCase(), 160, 395);
    drawCuckooTex(g, rgb);
    return t;
  }

  // Draw one textured triangle (affine map source -> destination)
  function tri(g, img, s, d) {
    const [s0, s1, s2] = s, [d0, d1, d2] = d;
    const den = (s1[0]-s0[0])*(s2[1]-s0[1]) - (s2[0]-s0[0])*(s1[1]-s0[1]);
    if (!den) return;
    const a  = ((d1[0]-d0[0])*(s2[1]-s0[1]) - (d2[0]-d0[0])*(s1[1]-s0[1])) / den;
    const b  = ((d1[1]-d0[1])*(s2[1]-s0[1]) - (d2[1]-d0[1])*(s1[1]-s0[1])) / den;
    const c  = ((s1[0]-s0[0])*(d2[0]-d0[0]) - (s2[0]-s0[0])*(d1[0]-d0[0])) / den;
    const dd = ((s1[0]-s0[0])*(d2[1]-d0[1]) - (s2[0]-s0[0])*(d1[1]-d0[1])) / den;
    const e = d0[0] - a*s0[0] - c*s0[1], f = d0[1] - b*s0[0] - dd*s0[1];
    const mx = (d0[0]+d1[0]+d2[0]) / 3, my = (d0[1]+d1[1]+d2[1]) / 3;
    g.save();
    g.beginPath();
    [d0, d1, d2].forEach((p, i) => {
      const x = mx + (p[0]-mx) * 1.04, y = my + (p[1]-my) * 1.04;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.closePath(); g.clip();
    g.transform(a, b, c, dd, e, f);
    g.drawImage(img, 0, 0);
    g.restore();
  }

  function capturePhoto() {
    const W = window.innerWidth, H = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    const cv = document.createElement('canvas');
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const g = cv.getContext('2d');
    g.scale(dpr, dpr);
    const vw = arVideo.videoWidth, vh = arVideo.videoHeight;
    if (vw && vh) {                         // same crop as object-fit: cover
      const k = Math.max(W / vw, H / vh);
      g.drawImage(arVideo, (W - vw*k) / 2, (H - vh*k) / 2, vw*k, vh*k);
    } else { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); }
    if (arM) {
      const tex = buildTex(), N = 12, SW = 540, SH = 610, X0 = -110, Y0 = -180;
      g.globalAlpha = FADES[fadeIdx];
      const P = [];
      for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
        const lx = X0 + SW*i/N - 160, ly = Y0 + SH*j/N - 160;
        const x = arM.c0[0]*lx + arM.c1[0]*ly + arM.c3[0];
        const y = arM.c0[1]*lx + arM.c1[1]*ly + arM.c3[1];
        const z = arM.c0[2]*lx + arM.c1[2]*ly + arM.c3[2];
        const w = arF - z;
        P.push(w > 1 ? [W/2 + x*arF/w, H/2 + y*arF/w] : null);
      }
      const Tx = tex.width / N, Ty = tex.height / N;
      for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
        const q = [P[j*(N+1)+i], P[j*(N+1)+i+1], P[(j+1)*(N+1)+i], P[(j+1)*(N+1)+i+1]];
        if (q.some(p => !p)) continue;
        const s = [[i*Tx, j*Ty], [(i+1)*Tx, j*Ty], [i*Tx, (j+1)*Ty], [(i+1)*Tx, (j+1)*Ty]];
        tri(g, tex, [s[0], s[1], s[2]], [q[0], q[1], q[2]]);
        tri(g, tex, [s[1], s[3], s[2]], [q[1], q[3], q[2]]);
      }
      g.globalAlpha = 1;
    }
    // quick shutter flash
    const fl = document.createElement('div');
    fl.style.cssText = 'position:absolute;inset:0;background:#fff;opacity:.85;transition:opacity .35s;pointer-events:none';
    arEl.appendChild(fl);
    requestAnimationFrame(() => { fl.style.opacity = 0; });
    setTimeout(() => fl.remove(), 450);

    // synchronous encode so the share sheet still counts as a direct tap
    const bin = atob(cv.toDataURL('image/jpeg', 0.92).split(',')[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const file = new File([bytes], 'clock-on-my-wall.jpg', { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Braun AB 1 Clock' }).catch(() => {});
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
    }
  }
  document.getElementById('arShot').addEventListener('click', capturePhoto);

  document.getElementById('arModel').addEventListener('click', () => {
    setModel(MODELS[(MODELS.indexOf(model) + 1) % MODELS.length]);
  });

  btnAR.addEventListener('click', startAR);
  document.getElementById('arExit').addEventListener('click', stopAR);
  document.getElementById('arCenter').addEventListener('click', () => { needPlace = true; });
  document.getElementById('arLock').addEventListener('click', e => {
    arLocked = !arLocked;
    e.currentTarget.classList.toggle('active', arLocked);
    e.currentTarget.textContent = arLocked ? t('unlock') : t('lock');
  });
  document.getElementById('arFade').addEventListener('click', () => {
    fadeIdx = (fadeIdx + 1) % FADES.length;
    arPlane.style.opacity = FADES[fadeIdx];
  });
  document.querySelectorAll('.ar-bottom .btn').forEach(b =>
    b.addEventListener('click', () => document.getElementById(b.dataset.for).click()));
  arAbout.addEventListener('click', () => document.getElementById('aboutCard').click());

  /* ---------- Apply language to every label ---------- */
  const TXT_IDS = {
    btnSpeed: 'speed', btnSlow: 'slow', btnReset: 'reset', btnAbout: 'about', btnColor: 'color', btnAR: 'viewAR',
    arExit: 'exit', arModel: 'model', arShot: 'photo', arCenter: 'center', arFade: 'fade', arHint: 'hint'
  };

  function applyLang() {
    const L = I18N[lang];
    document.documentElement.lang = lang;
    DAYS = L.days;
    MONTHS = L.months;
    lastDateKey = '';
    order = [];
    Object.keys(TXT_IDS).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.textContent = L[TXT_IDS[id]];
    });
    document.querySelectorAll('.model-btn').forEach(b => { b.textContent = L['m_' + b.dataset.model]; });
    const at = document.querySelector('.about-title');
    if (at) at.textContent = L.aboutTitle;
    btnBack.textContent = direction < 0 ? L.forward : L.back;
    document.getElementById('arLock').textContent = arLocked ? L.unlock : L.lock;
    syncSoundBtn();
    syncSpeakUI();
    syncAwakeBtn();
    syncWorld();
    syncTickBtn();
    speakOpts[0].textContent = L.speakOff;
    cuckooEl.setAttribute('aria-label', L.cuckooAria);
    soundBtn.setAttribute('aria-label', L.cuckooToggleAria);
    btnSpeak.setAttribute('aria-label', L.speakAria);
    speakMenu.setAttribute('aria-label', L.speakMenuAria);
    worldCells.forEach((c, i) => { c.name.textContent = L.cities[i]; });
    lastWorldKey = -1;
    document.querySelectorAll('.lang-btn').forEach(b => {
      const on = b.dataset.lang === lang;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem('braunLang', lang); } catch (e) {}
    if (hasVoice) { try { speechSynthesis.cancel(); } catch (e) {} }
    hideAbout();
    applyLang();
  }));
  applyLang();

  updateStatus();
</script>
