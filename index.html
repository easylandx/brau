<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Braun AB 1 Clock</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🕰️%3C/text%3E%3C/svg%3E" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@300;400&display=swap');

    /* BraunLogo: a small custom typeface (letters B R A U N) drawn after the Braun logo,
       with the tall arched A. Embedded so it works everywhere. */
    @font-face {
      font-family: 'BraunLogo';
      src: url(data:font/ttf;base64,AAEAAAAKAIAAAwAgT1MvMkhSR4AAAAEoAAAAYGNtYXABpAMfAAABpAAAAHxnbHlmHnIb9gAAAjAAAAOsaGVhZC78hFEAAACsAAAANmhoZWEFmgGWAAAA5AAAACRobXR4CoUAxAAAAYgAAAAabG9jYQI2A24AAAIgAAAAEG1heHAACwBmAAABCAAAACBuYW1lm2Cg9AAABdwAAABmcG9zdAB5AHoAAAZEAAAAMAABAAAAAQAAGltrCV8PPPUAAwPoAAAAAOcCH+cAAAAA5wIf5wAxAAABsQOjAAAAAwACAAAAAAAAAAEAAAO2/2oAAAH0ADEAMQGxAAEAAAAAAAAAAAAAAAAAAAAGAAEAAAAHAGQAAwAAAAAAAgAAAAAAAAAAAAAAAAAAAAAAAwG5AZAABQAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAPz8/PwAAACAAdQO2/2oAAAPoAMgAAAAAAAAAAAK8ArwAAAAgAAAB9AAAASwAAAHOADEBxwAxAeIAMQG9ADEAMQAAAAAAAgAAAAMAAAAUAAMAAQAAABQABABoAAAAFAAQAAMABAAgAEIATgBSAFUAYgBuAHIAdf//AAAAIABBAE4AUgBVAGEAbgByAHX////hAAD/uP+x/7AAAP+Y/5H/kAABAAAAEgAAAAAAAAAOAAAAAAAAAAAABAACAAQAAgAAAAAAAAB6ALsBHgF7AdYAAwAxAAABnQK8ADMASwBjAAABHwQVFxURFQ8PIyERMzMfEBUXFyc/Bz0CLwgjIxUTPwg1NS8IIyMVAZMCAgIBAgEBAgMDBAUFBgYHBwgHCQgICf72+QgJCAgIBwgGBwYFBAQEAgIBAQIDjgYGAwUEBAICAQIDAgIFAgYGBl9lBgYFBQUDAwEBAQICAwUFAgYDBmUBhwMDAwQDBAME/vYJCAgJBwgHBwYGBQUEAwMCAQK8AQIDAwQFBQYGBwcIBwkICAnMAgINAQIBBAQFBgYGeAMGBgUDAgQBAwK+/swBAgIEBAUFBgaKAwYGAwUEBAECAdAAAAIAMQAAAZYCvAAZADEAADMRITMfDxURIxEjERMzPwc1NS8IIyMVMQEDCQgICQcIBwcGBgUFBAMDAgF0gVQGBgUFBQMDAQEBAgMCAgUDBQYGVAK8AQIDAwQFBQYGBwcIBwkICAn9pgE0/swBlwICBAQFBgYGeAMGBgUDAgQBAwK+AAACADEAAAGxA6MAKgBRAAATPxAfEREjESMRIxElNS8QDxAVETMyAgQFBggJCgsNDQ4PDxAQEREREBAQEA8ODQwMCgkIBgUEAgFtpm0BEwECAgMDBAQFBgUHBgcHBwcHBwgHBwYHBgYFBQQEBAIDAQGmAvQREBAPDw4NDQsKCQgGBQQCAQECBAUGCAkKCw0NDg8PEBAREf0dATP+zQLjCQgHBwcHBgYGBQUFAwQDAgEBAQEBAQIDBAMFBQUGBgYHBwcHCP6rAAABADEAAAGMArwATQAAAREVDxAvEREzERUfDzMzPw81EQGMAgQEBgcICQsLDA0NDg4PDw8QDw4PDg0NDAsKCggHBgQDAgFwAQECAgIDAwQEBAUFBQUFBQYFBQYFBQQFBAQEAwMCAgIBAQK8/fIQDw4PDg0NDAsKCggHBgQDAgEBAgMEBgcICgoLDA0NDg8ODxACDv3yBgUFBQUFBQQEBAMDAgICAQEBAQICAgMDBAQEBQUFBQUFBgIOAAABADEAAAGMArwATQAAMxE/ER8QFREjETUvDyMjDw8VETEBAgMEBgcICgoLDA0NDg8ODxAPDw8ODg0NDAsLCQgHBgQEAnABAQICAgMDBAQEBQQFBQYFBQYFBQUFBQUEBAQDAwICAgEBAg4QDw4PDg0NDAsKCggHBgQDAgEBAgMEBgcICgoLDA0NDg8ODxD98gIYBQUFBgUEBQQEBAMDAgICAQEBAQICAgMDBAQEBQQFBgUFBf3oAAAABAA2AAEAAAAAAAEACQAAAAEAAAAAAAIABwAJAAMAAQQJAAEAEgAQAAMAAQQJAAIADgAiQnJhdW5Mb2dvUmVndWxhcgBCAHIAYQB1AG4ATABvAGcAbwBSAGUAZwB1AGwAYQByAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHAAAAAwAlADUAJAA4ADE=) format('truetype');
      font-display: block;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rgb: 212, 245, 0;
      --fluor: rgb(var(--rgb));
      --bg: #0a0a0a;
      --face: #111111;
      --shadow: rgba(var(--rgb), 0.08);
    }

    html { overflow-y: auto; -webkit-text-size-adjust: 100%; }

    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      gap: 48px;
      /* side margins kept explicit so they never get zeroed */
      padding-top: 32px;
      /* extra bottom room so the page always scrolls on iPhone and Safari can tuck the address bar away */
      padding-bottom: 160px;
      padding-left: 20px;
      padding-right: 20px;
    }

    .clock-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
    }

    /* Brand label */
    .brand {
      font-family: 'BraunLogo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 26px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: rgba(var(--rgb), 0.6);
      transition: opacity 0.18s ease;
      /* offset trailing letter-spacing so it stays optically centred */
      padding-left: 0.02em;
    }
    .brand.fade { opacity: 0; }

    /* Outer bezel */
    .bezel {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #2c2c2c, #111 55%, #0d0d0d);
      box-shadow:
        0 0 0 2px #222,
        0 0 0 4px #181818,
        0 8px 40px rgba(0,0,0,0.85),
        0 0 60px var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    /* Clock face */
    .face {
      width: 296px;
      height: 296px;
      border-radius: 50%;
      background: var(--face);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#clockCanvas { position: absolute; top: 0; left: 0; }

    .readout-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .date-line {
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.3em;
      padding-left: 0.3em; /* balances trailing letter-spacing */
      text-transform: uppercase;
      white-space: nowrap;
      color: rgba(var(--rgb), 0.35);
      font-variant-numeric: tabular-nums;
    }

    /* Digital time stays exactly centred; the status badge hangs off its right edge */
    .readout {
      position: relative;
      display: flex;
      justify-content: center;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: rgba(var(--rgb), 0.45);
      font-variant-numeric: tabular-nums;
    }
    #digitalTime {
      padding-left: 0.2em; /* balances the trailing letter-spacing so digits sit truly centred */
      white-space: nowrap;
    }
    .status {
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      margin-left: 14px;
      font-size: 10px;
      letter-spacing: 0.2em;
      white-space: nowrap;
      text-align: left;
    }

    /* Control buttons */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 720px;
    }

    .btn, .cta-btn {
      display: inline-block;
      background: transparent;
      border: 1px solid rgba(var(--rgb), 0.45);
      color: var(--fluor);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn {
      font-size: 10px;
      letter-spacing: 0.25em;
      padding-top: 11px;
      padding-bottom: 11px;
      padding-left: 18px;
      padding-right: 14px; /* 18 - trailing letter-spacing offset */
      min-width: 86px;
    }

    .cta-btn {
      font-size: 11px;
      letter-spacing: 0.3em;
      padding-top: 13px;
      padding-bottom: 13px;
      padding-left: 36px;
      padding-right: 36px;
    }

    .btn:hover, .cta-btn:hover {
      background: rgba(var(--rgb), 0.07);
      border-color: var(--fluor);
      box-shadow: 0 0 18px rgba(var(--rgb), 0.15);
    }
    .btn:focus-visible, .cta-btn:focus-visible {
      outline: 1px solid var(--fluor);
      outline-offset: 3px;
    }
    .btn.active {
      background: rgba(var(--rgb), 0.14);
      border-color: var(--fluor);
      box-shadow: 0 0 18px rgba(var(--rgb), 0.22);
    }

    /* About popup: sits in the page flow between the buttons and EasyLandX,
       so it can never overlap either of them */
    .about {
      display: grid;
      grid-template-rows: 0fr;
      width: 100%;
      max-width: 360px;
      margin-top: -28px; /* cancels the flex gap while collapsed */
      opacity: 0;
      pointer-events: none;
      transition: grid-template-rows 0.35s ease, margin-top 0.35s ease, opacity 0.3s ease;
    }
    .about.show {
      grid-template-rows: 1fr;
      margin-top: 0;
      opacity: 1;
      pointer-events: auto;
    }
    .about-clip { min-height: 0; overflow: hidden; }
    .about-card {
      background: rgba(14,14,14,0.96);
      border: 1px solid rgba(var(--rgb), 0.45);
      border-radius: 3px;
      box-shadow: 0 0 30px rgba(var(--rgb), 0.12);
      overflow: hidden;
      cursor: pointer;
    }
    .about-inner {
      padding-top: 22px;
      padding-bottom: 20px;
      padding-left: 24px;
      padding-right: 24px;
    }
    .about-title {
      font-size: 9px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(var(--rgb), 0.5);
      margin-bottom: 12px;
    }
    .about-text {
      font-size: 14px;
      font-weight: 300;
      line-height: 1.6;
      color: var(--fluor);
    }
    .about-bar {
      height: 2px;
      background: var(--fluor);
      transform-origin: left center;
      transform: scaleX(1);
    }
    .about.show .about-bar {
      animation: drain 8s linear forwards;
    }
    @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    @media (min-width: 601px) {
      #btnBack { min-width: 112px; }
    }

    /* Mobile: row 1 = Back / Speed / Slow, row 2 = Reset / About / Color */
    @media (max-width: 600px) {
      .controls {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        max-width: 340px;
      }
      .controls .btn {
        min-width: 0;
        width: 100%;
        grid-column: span 2;
      }
    }

    /* ---------- AR wall view ---------- */
    .cta-btn[hidden], .ar[hidden] { display: none; }
    button.cta-btn { font-family: inherit; }
    #arCanvas { position: absolute; top: 0; left: 0; width: 296px; height: 296px; }
    .ar { position: fixed; inset: 0; z-index: 1000; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    .ar video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ar-stage { position: absolute; inset: 0; overflow: hidden; }
    .ar-plane { position: absolute; left: 50%; top: 50%; width: 320px; height: 320px; margin: -160px 0 0 -160px; transform-origin: 50% 50%; will-change: transform; }
    .ar-halo { position: absolute; inset: -110px; border-radius: 50%; background: radial-gradient(circle, rgba(var(--rgb), .22), rgba(var(--rgb), 0) 68%); mix-blend-mode: screen; pointer-events: none; }
    .ar-brand { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 26px; text-align: center; }
    .ar-read { position: absolute; left: 0; right: 0; top: 100%; margin-top: 26px; text-align: center; color: rgba(var(--rgb), .85); text-shadow: 0 0 10px rgba(var(--rgb), .6); font-variant-numeric: tabular-nums; }
    .ar-time { font-size: 20px; font-weight: 300; letter-spacing: .2em; }
    .ar-date { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; margin-top: 8px; opacity: .7; }
    .ar-top { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; justify-content: center; gap: 8px; padding: 0 12px; flex-wrap: wrap; }
    .ar-bottom { position: absolute; left: 0; right: 0; margin: 0 auto; max-width: 340px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; padding: 0 12px; }
    .ar-bottom .btn { grid-column: span 2; min-width: 0; width: 100%; }
    .ar .btn { background: rgba(0,0,0,.5); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); min-width: 0; }
    .ar-about { position: absolute; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 340px; bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); background: rgba(14,14,14,.92); border: 1px solid rgba(var(--rgb), .45); border-radius: 3px; padding: 16px 18px; color: var(--fluor); font-size: 13px; font-weight: 300; line-height: 1.55; display: none; }
    .ar-about.show { display: block; }
    .ar-hint { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 62px); text-align: center; font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: rgba(255,255,255,.8); text-shadow: 0 1px 6px #000; transition: opacity .6s; pointer-events: none; }
  </style>
</head>
<body>

<div class="clock-wrap">
  <span class="brand" id="brand">Braun</span>

  <div class="bezel">
    <div class="face">
      <canvas id="clockCanvas" width="296" height="296"></canvas>
    </div>
  </div>

  <div class="readout-group">
    <div class="readout">
      <span id="digitalTime"></span>
      <span class="status" id="status"></span>
    </div>
    <div class="date-line" id="dateLine"></div>
  </div>

  <div class="controls">
    <button class="btn" id="btnBack" type="button">Back</button>
    <button class="btn" id="btnSpeed" type="button">Speed</button>
    <button class="btn" id="btnSlow" type="button">Slow</button>
    <button class="btn" id="btnReset" type="button">Reset</button>
    <button class="btn" id="btnAbout" type="button">About</button>
    <button class="btn" id="btnColor" type="button">Color</button>
  </div>

  <div class="about" id="about" role="status" aria-live="polite">
    <div class="about-clip">
      <div class="about-card" id="aboutCard">
        <div class="about-inner">
          <div class="about-title">About time</div>
          <div class="about-text" id="aboutText"></div>
        </div>
        <div class="about-bar" id="aboutBar"></div>
      </div>
    </div>
  </div>

  <button class="cta-btn" id="btnAR" type="button" hidden>View on my wall · AR</button>

  <a class="cta-btn" href="https://easylandx.github.io" target="_blank" rel="noopener">
    EasyLandX
  </a>
</div>


<div class="ar" id="ar" hidden>
  <video id="arVideo" playsinline muted autoplay></video>
  <div class="ar-stage" id="arStage">
    <div class="ar-plane" id="arPlane">
      <div class="ar-halo"></div>
      <span class="brand ar-brand" id="arBrand">Braun</span>
      <div class="bezel"><div class="face"><canvas id="arCanvas" width="740" height="740"></canvas></div></div>
      <div class="ar-read"><div class="ar-time" id="arTime"></div><div class="ar-date" id="arDate"></div></div>
    </div>
  </div>
  <div class="ar-hint" id="arHint">Drag to move · pinch to resize</div>
  <div class="ar-top">
    <button class="btn" id="arExit" type="button">Exit</button>
    <button class="btn" id="arCenter" type="button">Center</button>
    <button class="btn" id="arLock" type="button">Lock</button>
    <button class="btn" id="arFade" type="button">Fade</button>
  </div>
  <div class="ar-about" id="arAbout"></div>
  <div class="ar-bottom">
    <button class="btn" data-for="btnBack" type="button">Back</button>
    <button class="btn" data-for="btnSpeed" type="button">Speed</button>
    <button class="btn" data-for="btnSlow" type="button">Slow</button>
    <button class="btn" data-for="btnReset" type="button">Reset</button>
    <button class="btn" data-for="btnAbout" type="button">About</button>
    <button class="btn" data-for="btnColor" type="button">Color</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('clockCanvas');
  let ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const cx = W / 2;
  const cy = H / 2;
  const R = cx - 4;
  const FACE_BG = '#111111';

  /* ---------- State ---------- */
  const COLORS = [
    [212, 245, 0],   // lime (default)
    [0, 240, 255],   // cyan
    [255, 43, 214],  // magenta
    [255, 122, 0],   // orange
    [255, 59, 92],   // hot red
    [57, 255, 20],   // neon green
    [178, 107, 255], // violet
    [255, 255, 255]  // white
  ];
  const MAX_SPEED = 65536;
  const MIN_SPEED = 1 / 1024;

  let colorIndex = 0;
  let direction = 1;
  let speed = 1;
  let virtualTime = Date.now();
  let lastFrame = performance.now();

  let FLUOR, FLUOR_DIM;
  function rgba(a) { const c = COLORS[colorIndex]; return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

  function applyColor() {
    const c = COLORS[colorIndex];
    document.documentElement.style.setProperty('--rgb', c.join(', '));
    FLUOR = `rgb(${c.join(',')})`;
    FLUOR_DIM = rgba(0.55);
  }
  applyColor();

  /* ---------- Drawing ---------- */
  function drawFace() {
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = FACE_BG;
    ctx.fill();

    const grd = ctx.createRadialGradient(cx, cy, R * 0.7, cx, cy, R);
    grd.addColorStop(0, rgba(0));
    grd.addColorStop(1, rgba(0.04));
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    for (let i = 0; i < 60; i++) {
      const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
      const isHour = i % 5 === 0;
      const tickOuter = R - 3;
      const tickInner = isHour ? R - 16 : R - 9;

      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(angle) * tickOuter, cy + Math.sin(angle) * tickOuter);
      ctx.lineTo(cx + Math.cos(angle) * tickInner, cy + Math.sin(angle) * tickInner);
      ctx.strokeStyle = isHour ? FLUOR : FLUOR_DIM;
      ctx.lineWidth = isHour ? 2.5 : 1;
      ctx.lineCap = 'round';
      ctx.stroke();

      if (isHour) {
        const hour = i === 0 ? 12 : i / 5;
        const numR = R - 32;
        const nx = cx + Math.cos(angle) * numR;
        const ny = cy + Math.sin(angle) * numR;
        ctx.fillStyle = FLUOR;
        ctx.font = `300 ${hour === 12 || hour === 6 ? 18 : 15}px 'Helvetica Neue', Helvetica, Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(hour), nx, ny);
      }
    }

    ctx.beginPath();
    ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = FLUOR;
    ctx.fill();
  }

  function drawHand(angleDeg, length, width, color) {
    const angle = angleDeg * Math.PI / 180;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, length * 0.18);
    ctx.lineTo(0, -length);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    ctx.stroke();
    ctx.restore();
  }

  function drawSecondHand(angleDeg) {
    const angle = angleDeg * Math.PI / 180;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);

    ctx.beginPath();
    ctx.moveTo(0, R * 0.28);
    ctx.lineTo(0, -(R * 0.72));
    ctx.strokeStyle = FLUOR;
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    ctx.shadowColor = FLUOR;
    ctx.shadowBlur = 8;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, R * 0.18, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = FLUOR;
    ctx.shadowBlur = 10;
    ctx.fill();

    ctx.restore();
  }

  /* ---------- Main loop ---------- */
  const digitalEl = document.getElementById('digitalTime');
  const statusEl = document.getElementById('status');
  const dateEl = document.getElementById('dateLine');
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  let lastDateKey = '';
  const pad = n => String(n).padStart(2, '0');

  function updateStatus() {
    const parts = [];
    if (direction < 0) parts.push('◀');
    if (speed > 1) parts.push('×' + speed);
    else if (speed < 1) parts.push('×1/' + Math.round(1 / speed));
    statusEl.textContent = parts.join(' ');
  }

  function draw(now) {
    const dt = now - lastFrame;
    lastFrame = now;
    virtualTime += dt * speed * direction;

    const d = new Date(virtualTime);
    const hrs  = d.getHours() % 12;
    const mins = d.getMinutes();
    const secs = d.getSeconds();
    const ms   = d.getMilliseconds();

    digitalEl.textContent = `${pad(d.getHours())}:${pad(mins)}:${pad(secs)}.${String(ms).padStart(3, '0')}`;

    // Date follows the virtual clock: rolls back past midnight in reverse, forward at speed
    const dateKey = d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate();
    if (dateKey !== lastDateKey) {
      lastDateKey = dateKey;
      dateEl.textContent = `${DAYS[d.getDay()]} ${pad(d.getDate())} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    }

    const secFrac   = secs + ms / 1000;
    const secAngle  = secFrac * 6;
    const minAngle  = (mins + secFrac / 60) * 6;
    const hourAngle = (hrs + mins / 60 + secFrac / 3600) * 30;

    paintClock(hourAngle, minAngle, secAngle);

    if (arActive) {            // second, sharper pass for the AR wall clock
      const mainCtx = ctx;
      ctx = arCtx;
      arCtx.setTransform(AR_K, 0, 0, AR_K, 0, 0);
      paintClock(hourAngle, minAngle, secAngle);
      ctx = mainCtx;
      arTick();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ---------- Controls ---------- */
  const brandEl = document.getElementById('brand');
  const btnBack = document.getElementById('btnBack');
  const btnSpeed = document.getElementById('btnSpeed');
  const btnSlow = document.getElementById('btnSlow');

  function syncSpeedButtons() {
    btnSpeed.classList.toggle('active', speed > 1);
    btnSlow.classList.toggle('active', speed < 1);
  }
  const btnAbout = document.getElementById('btnAbout');

  // Brand label: plain text set in the BraunLogo typeface (the tall A is part of the font)
  function setBrand(text) {
    if (brandEl.dataset.word === text) return;
    brandEl.classList.add('fade');
    setTimeout(() => {
      brandEl.textContent = text;
      brandEl.dataset.word = text;
      brandEl.classList.remove('fade');
    }, 180);
  }
  brandEl.dataset.word = 'Braun';

  // BACK: toggle time direction + spell brand backwards
  btnBack.addEventListener('click', () => {
    direction *= -1;
    btnBack.classList.toggle('active', direction < 0);
    btnBack.textContent = direction < 0 ? 'Forward' : 'Back';
    setBrand(direction < 0 ? 'Braun'.split('').reverse().join('') : 'Braun');
    updateStatus();
  });

  // SPEED: double each press (wraps back to x1 after x65536)
  btnSpeed.addEventListener('click', () => {
    speed = speed >= MAX_SPEED ? 1 : speed * 2;
    syncSpeedButtons();
    updateStatus();
  });

  // SLOW: halve the speed on each press (wraps back to x1 after x1/1024)
  btnSlow.addEventListener('click', () => {
    speed = speed <= MIN_SPEED ? 1 : speed / 2;
    syncSpeedButtons();
    updateStatus();
  });

  // RESET: default mode, speed, colour and real time
  document.getElementById('btnReset').addEventListener('click', () => {
    direction = 1;
    speed = 1;
    colorIndex = 0;
    virtualTime = Date.now();
    lastFrame = performance.now();
    applyColor();
    btnBack.classList.remove('active');
    btnBack.textContent = 'Back';
    syncSpeedButtons();
    setBrand('Braun');
    hideAbout();
    updateStatus();
  });

  // COLOR: cycle through 8 neon colours
  document.getElementById('btnColor').addEventListener('click', () => {
    colorIndex = (colorIndex + 1) % COLORS.length;
    applyColor();
  });

  // ABOUT: 8-second popup with a saying about time
  const SAYINGS = [
    "Time is the only currency you spend without ever seeing your balance, so spend it on things you would be proud to have paid for.",
    "A clock does not make time; it only shows how generously or how stingily you are using it.",
    "The hours spent waiting for the perfect moment are the very hours that could have built it.",
    "Yesterday is a closed ledger, tomorrow an unsigned cheque, and today the only pen you actually hold.",
    "Patience is simply time given room to work: the oak is just an acorn that refused to hurry.",
    "Every second is a small door; most people walk past thousands of them while searching for a bigger one.",
    "Time heals less than it reveals: given enough of it, what truly mattered stands apart from what merely felt urgent.",
    "Good design, like good timekeeping, is quiet: it tells you exactly what you need and nothing you don’t.",
    "You cannot slow the clock, but you can deepen the minute, because attention is the only way to make an hour longer.",
    "The best time to begin was long ago; the second best is the tick you are hearing right now.",
    "Minutes are the coins of a life: hoard none, squander few, and give the best ones to the people who matter."
  ];

  const aboutEl = document.getElementById('about');
  const aboutText = document.getElementById('aboutText');
  let aboutTimer = null;
  let sayingIdx = -1;
  let order = [];

  function nextSaying() {
    if (!order.length) {
      order = SAYINGS.map((_, i) => i).sort(() => Math.random() - 0.5);
      if (order[order.length - 1] === sayingIdx && order.length > 1) order.reverse();
    }
    sayingIdx = order.pop();
    return SAYINGS[sayingIdx];
  }

  function hideAbout() {
    clearTimeout(aboutTimer);
    aboutEl.classList.remove('show');
  }

  function showAbout() {
    clearTimeout(aboutTimer);
    aboutText.textContent = nextSaying();
    // restart the progress-bar animation without collapsing the window
    const bar = document.getElementById('aboutBar');
    bar.style.animation = 'none';
    void bar.offsetWidth;
    bar.style.animation = '';
    aboutEl.classList.add('show');
    aboutTimer = setTimeout(hideAbout, 8000);
  }

  btnAbout.addEventListener('click', showAbout);
  document.getElementById('aboutCard').addEventListener('click', hideAbout);

  function paintClock(hourAngle, minAngle, secAngle) {
    ctx.clearRect(0, 0, W, H);
    drawFace();
    drawHand(hourAngle, R * 0.48, 5.5, FLUOR);
    drawHand(minAngle, R * 0.72, 3.5, FLUOR);
    drawSecondHand(secAngle);
    ctx.beginPath();
    ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = FLUOR;
    ctx.fill();
  }

  /* ---------- AR wall view (camera + motion sensors) ----------
     The camera feed is the background; the clock is a flat panel pinned to a fixed
     direction in space, so it stays on the wall as you move the phone. */
  const AR_K = 740 / 296;
  const AR_DIST = 1000;               // virtual distance in px-units
  const D2R = Math.PI / 180;
  const arEl = document.getElementById('ar');
  const arVideo = document.getElementById('arVideo');
  const arStage = document.getElementById('arStage');
  const arPlane = document.getElementById('arPlane');
  const arCtx = document.getElementById('arCanvas').getContext('2d');
  const arAbout = document.getElementById('arAbout');
  const btnAR = document.getElementById('btnAR');
  let arActive = false, arStream = null, arWake = null, arF = 700;
  let ori = null, needPlace = true, az = 0, pitch = 0, sc = 1, arLocked = false, fadeIdx = 0;
  const FADES = [1, 0.7, 0.4];

  // Only offer AR on touch devices with a camera
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.matchMedia('(pointer: coarse)').matches) {
    btnAR.hidden = false;
  }

  function setF() {
    arF = 0.866 * window.innerHeight;     // ~60° vertical field of view of the iPhone camera
    arStage.style.perspective = arF + 'px';
  }
  window.addEventListener('resize', () => { if (arActive) setF(); });

  window.addEventListener('deviceorientation', e => {
    if (e.beta === null || e.beta === undefined) return;
    ori = [e.alpha || 0, e.beta, e.gamma || 0];
  });

  // Rotation matrix device -> world (W3C order Z-X'-Y''), row-major
  function rotM(o) {
    const a = o[0] * D2R, b = o[1] * D2R, g = o[2] * D2R;
    const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), cg = Math.cos(g), sg = Math.sin(g);
    return [
      ca*cg - sa*sb*sg, -cb*sa, ca*sg + cg*sa*sb,
      cg*sa + ca*sb*sg,  ca*cb, sa*sg - ca*cg*sb,
      -cb*sg,            sb,    cb*cg
    ];
  }

  async function startAR() {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') { alert('Motion access is needed so the clock stays fixed on your wall. Allow it for this site and try again.'); return; }
      }
      arStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    } catch (err) {
      alert('Could not start AR: ' + ((err && err.message) || err));
      return;
    }
    arVideo.srcObject = arStream;
    arVideo.play().catch(() => {});
    arEl.hidden = false;
    arActive = true;
    needPlace = true;
    setF();
    const hint = document.getElementById('arHint');
    hint.style.opacity = 1;
    setTimeout(() => { hint.style.opacity = 0; }, 5000);
    try { if (navigator.wakeLock) arWake = await navigator.wakeLock.request('screen'); } catch (e) {}
  }

  function stopAR() {
    arActive = false;
    if (arStream) arStream.getTracks().forEach(t => t.stop());
    arStream = null;
    arVideo.srcObject = null;
    if (arWake) { arWake.release().catch(() => {}); arWake = null; }
    arEl.hidden = true;
  }

  function arTick() {
    if (!ori) return;
    const R3 = rotM(ori);
    if (needPlace) {                       // pin the clock where the camera is pointing now
      const fx = -R3[2], fy = -R3[5], fz = -R3[8];
      az = Math.atan2(fy, fx);
      pitch = Math.max(-0.6, Math.min(0.6, Math.asin(Math.max(-1, Math.min(1, fz)))));
      needPlace = false;
    }
    // text on the wall mirrors the main page
    document.getElementById('arBrand').textContent = brandEl.textContent;
    document.getElementById('arBrand').style.opacity = brandEl.classList.contains('fade') ? 0 : 1;
    document.getElementById('arTime').textContent = digitalEl.textContent + (statusEl.textContent ? '  ' + statusEl.textContent : '');
    document.getElementById('arDate').textContent = dateEl.textContent;
    document.querySelectorAll('.ar-bottom .btn').forEach(b => {
      const src = document.getElementById(b.dataset.for);
      b.textContent = src.textContent;
      b.classList.toggle('active', src.classList.contains('active'));
    });
    const showAbout = aboutEl.classList.contains('show');
    arAbout.classList.toggle('show', showAbout);
    if (showAbout) arAbout.textContent = aboutText.textContent;

    // vertical wall panel facing the viewer, placed at (az, pitch)
    const cp = Math.cos(pitch);
    const C = [AR_DIST * cp * Math.cos(az), AR_DIST * cp * Math.sin(az), AR_DIST * Math.sin(pitch)];
    const U = [Math.sin(az), -Math.cos(az), 0], V = [0, 0, 1], N = [-Math.cos(az), -Math.sin(az), 0];
    const T = v => [
      R3[0]*v[0] + R3[3]*v[1] + R3[6]*v[2],
      R3[1]*v[0] + R3[4]*v[1] + R3[7]*v[2],
      R3[2]*v[0] + R3[5]*v[1] + R3[8]*v[2]
    ];
    const u = T(U), v = T(V), n = T(N), c = T(C);
    if (c[2] > -30) { arPlane.style.visibility = 'hidden'; return; }   // behind the camera
    arPlane.style.visibility = 'visible';
    const f = x => x.toFixed(5);
    arPlane.style.transform = `matrix3d(${f(u[0]*sc)},${f(-u[1]*sc)},${f(u[2]*sc)},0,` +
      `${f(-v[0]*sc)},${f(v[1]*sc)},${f(-v[2]*sc)},0,` +
      `${f(n[0])},${f(-n[1])},${f(n[2])},0,` +
      `${f(c[0])},${f(-c[1])},${f(c[2] + arF)},1)`;
  }

  // Gestures: drag moves the clock along the wall, pinch resizes it
  let tp = null;
  const pts = e => {
    const t = e.touches;
    return { n: t.length, x: t[0].clientX, y: t[0].clientY,
             d: t.length > 1 ? Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY) : 0 };
  };
  arEl.addEventListener('touchstart', e => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    tp = pts(e);
  }, { passive: false });
  arEl.addEventListener('touchmove', e => {
    if (!tp || arLocked || e.target.closest('button')) return;
    e.preventDefault();
    const q = pts(e);
    if (q.n === 1 && tp.n === 1) {
      az -= (q.x - tp.x) / arF / Math.max(0.3, Math.cos(pitch));
      pitch = Math.max(-1.0, Math.min(1.0, pitch - (q.y - tp.y) / arF));
    } else if (q.n === 2 && tp.n === 2 && tp.d > 0) {
      sc = Math.max(0.25, Math.min(5, sc * q.d / tp.d));
    }
    tp = q;
  }, { passive: false });
  arEl.addEventListener('touchend', e => { tp = e.touches.length ? pts(e) : null; });

  btnAR.addEventListener('click', startAR);
  document.getElementById('arExit').addEventListener('click', stopAR);
  document.getElementById('arCenter').addEventListener('click', () => { needPlace = true; });
  document.getElementById('arLock').addEventListener('click', e => {
    arLocked = !arLocked;
    e.currentTarget.classList.toggle('active', arLocked);
    e.currentTarget.textContent = arLocked ? 'Unlock' : 'Lock';
  });
  document.getElementById('arFade').addEventListener('click', () => {
    fadeIdx = (fadeIdx + 1) % FADES.length;
    arPlane.style.opacity = FADES[fadeIdx];
  });
  document.querySelectorAll('.ar-bottom .btn').forEach(b =>
    b.addEventListener('click', () => document.getElementById(b.dataset.for).click()));
  arAbout.addEventListener('click', () => document.getElementById('aboutCard').click());

  updateStatus();
</script>
</body>
</html>
